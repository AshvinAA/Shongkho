# Shongkho frontend → backend proxy.
# The SPA calls same-origin /api and /static; nginx forwards them to the
# backend container. This keeps session cookies first-party (the FastAPI
# SessionMiddleware sets them), so no CORS friction in any environment.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits hashed asset names — cache them hard
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API + uploaded static files → FastAPI container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # OpenAPI docs live under /api/v1/docs (proxied above)

    # SPA fallback: every unknown path serves index.html (client routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
