<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Store POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card shadow-sm border-0" style="width: 470px;">
        <div class="card-body p-5">
            <h3 class="text-center mb-4 fw-bold">Create Account</h3>

            <form id="register-form">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" id="reg-phone" class="form-control" placeholder="017..." required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Account Type</label>
                    <select id="reg-role" class="form-select" required>
                        <option value="employee">Employee / Cashier</option>
                        <option value="owner">Store Owner</option>
                    </select>
                    <div class="form-text" id="role-hint">Employees must register with their store owner's ID.</div>
                </div>

                <!-- Only visible for employees: link to the owner they work for -->
                <div class="mb-3" id="employer-group" style="display:none;">
                    <label class="form-label">Owner ID (Your Employer)</label>
                    <input type="number" id="reg-employer-id" class="form-control" placeholder="e.g. 1">
                    <div class="form-text">Ask your store owner for their ID.</div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" id="reg-password" class="form-control" required>
                </div>

                <button type="button" class="btn btn-success w-100 btn-lg" onclick="submitRegistration()">Register Account</button>
            </form>

            <div class="text-center mt-3">
                <a href="/login" class="text-decoration-none">Already have an account? Log in</a>
            </div>
        </div>
    </div>

    <script>
        const roleSelect = document.getElementById('reg-role');
        const employerGroup = document.getElementById('employer-group');

        roleSelect.addEventListener('change', () => {
            // Only employees need an owner ID; owners do not.
            employerGroup.style.display = roleSelect.value === 'employee' ? 'block' : 'none';
        });

        async function submitRegistration() {
            const role = roleSelect.value;
            const payload = {
                name: document.getElementById('reg-name').value.trim(),
                phone_number: document.getElementById('reg-phone').value.trim(),
                role: role,
                password: document.getElementById('reg-password').value
            };

            if (role === 'employee') {
                const employerId = document.getElementById('reg-employer-id').value;
                if (!employerId) {
                    alert("Employees must enter their Owner ID to register.");
                    return;
                }
                payload.employer_id = parseInt(employerId);
            }

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`Account created! Your User ID is ${data.user_id}. You can now log in.`);
                    window.location.href = "/login";
                } else {
                    alert("Error: " + data.detail);
                }
            } catch (error) {
                console.error("Error during registration:", error);
                alert("Failed to connect to the server.");
            }
        }
    </script>
</body>
</html>
