<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Store POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card shadow-sm border-0" style="width: 400px;">
        <div class="card-body p-5">
            <h3 class="text-center mb-4 fw-bold">🛒 POS Login</h3>
            <p class="text-center text-muted mb-4">One login for Owners &amp; Employees</p>

            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" id="login-phone" class="form-control" required placeholder="017...">
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">Log In</button>
            </form>

            <div class="text-center mt-3">
                <a href="#" id="forgot-link" class="text-decoration-none text-muted">Forgot password?</a>
            </div>
            <div class="text-center mt-2">
                <a href="/register" class="text-decoration-none text-muted">Need an account? Register here.</a>
            </div>
        </div>
    </div>

    <!-- Forgot / Reset Password Modal -->
    <div class="modal fade" id="resetModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Reset Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" id="reset-phone" class="form-control" placeholder="017...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" id="reset-password" class="form-control">
                    </div>
                    <button class="btn btn-warning w-100" onclick="submitReset()">Set New Password</button>
                    <div id="reset-status" class="mt-3 small text-muted"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Already logged in? Go straight to the right dashboard.
        fetch('/auth/me')
            .then(r => { if (r.ok) window.location.href = '/'; })
            .catch(() => {});

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const phone = document.getElementById('login-phone').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone_number: phone, password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('name', data.name);

                    // Two types of login — role decides the landing page
                    if (data.role === 'owner') {
                        window.location.href = "/owner-dashboard";
                    } else {
                        window.location.href = "/employee-dashboard";
                    }
                } else {
                    alert("Login failed: " + (data.detail || "Invalid credentials"));
                }
            } catch (error) {
                console.error("Login error:", error);
                alert("Could not connect to the server.");
            }
        });

        // Forgot / reset password (shared for owner + employee)
        const resetModal = new bootstrap.Modal(document.getElementById('resetModal'));
        document.getElementById('forgot-link').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('reset-phone').value = document.getElementById('login-phone').value;
            resetModal.show();
        });

        async function submitReset() {
            const phone = document.getElementById('reset-phone').value.trim();
            const newPass = document.getElementById('reset-password').value;
            const status = document.getElementById('reset-status');

            if (!phone || !newPass) {
                status.textContent = "Enter your phone number and a new password.";
                return;
            }

            try {
                // Step 1: verify the account exists
                const check = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone_number: phone })
                });
                if (!check.ok) {
                    const err = await check.json();
                    status.textContent = err.detail || "Account not found.";
                    return;
                }

                // Step 2: set the new password
                const reset = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone_number: phone, new_password: newPass })
                });
                const data = await reset.json();
                if (reset.ok) {
                    status.textContent = "✅ " + data.detail;
                    setTimeout(() => resetModal.hide(), 1500);
                } else {
                    status.textContent = data.detail || "Reset failed.";
                }
            } catch (error) {
                status.textContent = "Could not connect to the server.";
            }
        }
    </script>
</body>
</html>
