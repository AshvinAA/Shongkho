<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Store POS System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        // Role info is exposed by the server for the shared templates.
        window.APP_USER = {
            id: {{ user.id if user else 'null' }},
            role: "{{ user.role if user else '' }}",
            name: "{{ user.name if user else '' }}"
        };
    </script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">🛒 Store POS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link text-warning fw-bold" href="/pos">POS Terminal</a></li>
                    <li class="nav-item"><a class="nav-link" href="/inventory">Inventory</a></li>
                    <li class="nav-item"><a class="nav-link" href="/sales">Sales</a></li>
                    <li class="nav-item"><a class="nav-link" href="/customers">Customers</a></li>
                    {% if user and user.role == 'owner' %}
                    <li class="nav-item"><a class="nav-link" href="/staff">Staff</a></li>
                    {% endif %}
                    <li class="nav-item ms-3 d-flex align-items-center">
                        <img id="nav-user-photo" src="" alt="" class="rounded-circle me-2 border border-secondary"
                             style="width:32px; height:32px; object-fit:cover; display:none;">
                        <div id="nav-user-initials" class="rounded-circle me-2 bg-secondary text-white fw-bold d-flex align-items-center justify-content-center"
                             style="width:32px; height:32px; font-size:0.75rem;">{{ user.name[:2].upper() if user else '?' }}</div>
                        <span class="text-white-50 me-3" id="nav-user-name"></span>
                        <button class="btn btn-outline-danger btn-sm" onclick="logoutUser()">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const currentPath = window.location.pathname;

        // Navbar avatar: server-rendered initials by default, photo swapped in once known.
        function renderNavAvatar(photoUrl) {
            const img = document.getElementById('nav-user-photo');
            const initials = document.getElementById('nav-user-initials');
            if (!img || !initials) return;
            if (photoUrl) {
                img.src = photoUrl;
                img.style.display = 'inline-block';
                initials.style.display = 'none';
            } else {
                img.style.display = 'none';
                initials.style.display = 'flex';
            }
        }
        // Paint instantly from the cached photo (kept in sync on login / profile edit)
        renderNavAvatar(localStorage.getItem('photo'));

        // Server-side session guard: if not logged in, bounce to /login.
        fetch('/auth/me')
            .then(r => {
                if (!r.ok && currentPath !== '/login' && currentPath !== '/register') {
                    window.location.href = '/login';
                }
                return r.json();
            })
            .then(me => {
                // Keep localStorage in sync with the server session
                if (me && me.user_id) {
                    localStorage.setItem('user_id', me.user_id);
                    localStorage.setItem('role', me.role);
                    localStorage.setItem('name', me.name);
                    const el = document.getElementById('nav-user-name');
                    if (el) el.innerText = `Hello, ${me.name} (${me.role})`;

                    // Fetch the authoritative profile photo for the navbar avatar
                    fetch('/employees/me/profile', { credentials: 'same-origin' })
                        .then(r => r.ok ? r.json() : null)
                        .then(profile => {
                            if (!profile) return;
                            localStorage.setItem('photo', profile.photo || '');
                            renderNavAvatar(profile.photo);
                        })
                        .catch(() => {});
                }
            })
            .catch(() => {});

        // Display fallback from localStorage immediately
        const userName = localStorage.getItem('name');
        if (userName && document.getElementById('nav-user-name')) {
            document.getElementById('nav-user-name').innerText = `Hello, ${userName}`;
        }

        // Global Logout: clear server session + local storage
        async function logoutUser() {
            try { await fetch('/auth/logout', { method: 'POST' }); } catch (e) {}
            localStorage.clear();
            window.location.href = "/login";
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
