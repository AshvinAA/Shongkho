<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Store POS System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">🛒 Store POS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link text-warning fw-bold" href="/pos">POS Terminal</a></li>
                    <li class="nav-item"><a class="nav-link" href="/inventory">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="/customers-ui">Customers</a></li>
                    <li class="nav-item"><a class="nav-link" href="/staff">Staff</a></li>
                    <li class="nav-item ms-3 d-flex align-items-center">
                        <span class="text-white-50 me-3" id="nav-user-name"></span>
                        <button class="btn btn-outline-danger btn-sm" onclick="logoutUser()">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Global Auth Check: If there's no token and we aren't on the login or register page, kick them out.
        const currentPath = window.location.pathname;
        const token = localStorage.getItem('token');
        
        if (!token && currentPath !== '/login' && currentPath !== '/register') {
            window.location.href = '/login';
        }

        // Display the logged-in user's name in the navbar
        const userName = localStorage.getItem('name');
        if (userName && document.getElementById('nav-user-name')) {
            document.getElementById('nav-user-name').innerText = `Hello, ${userName}`;
        }

        // Global Logout Function
        function logoutUser() {
            localStorage.clear();
            window.location.href = "/login";
        }
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
